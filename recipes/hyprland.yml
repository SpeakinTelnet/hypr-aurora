---
modules:
    - type: files
      files:
        - source: system
          destination: /

    - type: dnf
      repos:
        files:
          - https://copr.fedorainfracloud.org/coprs/lionheartp/Hyprland/repo/fedora-%OS_VERSION%/lionheartp-hyprland-fedora-%OS_VERSION%.repo
      install:
        packages:
          - fuzzel
          - hyprland
          - hyprland-guiutils
          - hyprlock
          - hypridle
          - hyprpaper
          - hyprshot
          - hyprsunset
          - awww
          - waybar
          - xdg-desktop-portal-hyprland
          - blueman
          - kwallet
          - pam-kwallet
          - qt5-qtgraphicaleffects
          - qt5-qtquickcontrols2
          - qt5-qtsvg
          - sddm
          - sddm-themes
      remove:
        packages:
          # KDE Plasma Desktop & Window Manager
          # - sddm-breeze
          # - sddm-wayland-plasma
          - kcm-plasmalogin
          - kde-settings-plasmalogin
          - plasma-login-manager      # requires kwin-wayland
          - plasma-lookandfeel-fedora # requires plasma-workspace
          - plasma-setup              # requires plasma-desktop QML module
          - plasma-print-manager-libs
          - plasma-print-manager
          - plasma-desktop
          - plasma-workspace
          - kwin
          - xwaylandvideobridge

    - type: systemd
      system:
        enabled:
          - sddm-boot.service
          - sddm.service

    - type: signing
